<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyFood — Buscar</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script>
    if (!localStorage.getItem("easyfood_token")) {
      window.location.replace("/login.html");
    }
  </script>
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <a class="logo" href="/index.html" title="EasyFood">
        <img src="/img/logo-cantina.png" alt="Cantina do Campus">
      </a>
      <div>
        <h1>EasyFood</h1>
        <p>Olá, <span id="nome-usuario">usuário</span></p>
      </div>
    </div>
    <nav class="topo-nav" id="menu-principal"></nav>
  </header>

  <main class="conteudo">
    <section class="hero">
      <div>
        <small>Busca avançada</small>
        <h2>Os mais próximos e bem avaliados</h2>
        <div class="busca-caixa">
          <input class="busca-topo" id="campo-busca" type="search" placeholder="Buscar por nome, categoria ou bairro...">
        </div>
      </div>
      <div class="hero-lado">
        <form id="form-busca">
          <div class="form-linha">
            <label>Nota mínima <input type="number" name="minRating" min="0" max="5" step="0.1" value="3"></label>
            <label>Nota máxima <input type="number" name="maxRating" min="0" max="5" step="0.1" value="5"></label>
          </div>
          <label>
            Ordenar
            <select name="ordenar">
              <option value="melhor">Melhor avaliados</option>
              <option value="proximidade">Mais próximos de mim</option>
            </select>
          </label>
          <p class="ajuda">A proximidade usa o endereço de <a href="/perfil.html">Meu endereço</a>.</p>
          <button type="submit" class="botao-principal">Buscar</button>
        </form>
      </div>
    </section>

    <section class="aviso" id="aviso" hidden></section>
    <h2 class="titulo-lista">Resultado</h2>
    <section class="grade-cards" id="lista-restaurantes">
      <p class="vazio">Faça uma busca para ver os restaurantes.</p>
    </section>
  </main>

  <footer class="rodape">
    <p>EasyFood — projeto acadêmico de Matheus Juvino</p>
  </footer>

  <script src="/js/sessao.js"></script>
  <script src="/js/busca.js"></script>
</body>
</html>
