<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyFood — Catálogo</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script>
    if (!localStorage.getItem("easyfood_token")) {
      window.location.replace("/login.html");
    }
  </script>
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="logo">EF</span>
      <div>
        <h1>EasyFood</h1>
        <p>Olá, <span id="nome-usuario">usuário</span></p>
      </div>
    </div>
    <nav class="topo-nav" id="menu-principal"></nav>
  </header>

  <main class="conteudo">
    <section class="faixa">
      <div>
        <h2>Catálogo</h2>
        <p>Veja todos os restaurantes cadastrados. Use o menu Buscar para filtrar por nota e proximidade.</p>
      </div>
      <span class="chip" id="total-restaurantes">Carregando catálogo...</span>
    </section>

    <section class="aviso" id="aviso" hidden></section>

    <section id="lista" class="painel">
      <div class="painel-cabecalho">
        <h2>Restaurantes</h2>
        <button type="button" id="botao-atualizar" class="botao-secundario">Atualizar</button>
      </div>
      <div class="lista-cards" id="lista-restaurantes">
        <p class="vazio">Carregando...</p>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>EasyFood — projeto acadêmico de Matheus Juvino</p>
  </footer>

  <script src="/js/sessao.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
