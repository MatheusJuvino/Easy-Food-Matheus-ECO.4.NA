<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyFood — Catálogo</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script>
    if (!localStorage.getItem("easyfood_token")) {
      window.location.replace("/login.html");
    }
  </script>
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <a class="logo" href="/index.html" title="EasyFood">
        <img src="/img/logo-cantina.png" alt="Cantina do Campus">
      </a>
      <div>
        <h1>EasyFood</h1>
        <p>Olá, <span id="nome-usuario">usuário</span></p>
      </div>
    </div>
    <nav class="topo-nav" id="menu-principal"></nav>
  </header>

  <main class="conteudo">
    <section class="hero">
      <div>
        <small>Olá, <span id="nome-hero">usuário</span></small>
        <h2>O que vamos comer hoje?</h2>
        <div class="busca-caixa">
          <input class="busca-topo" id="campo-busca" type="search" placeholder="Buscar por nome, categoria ou bairro...">
        </div>
      </div>
      <div class="hero-lado">
        <div class="stats">
          <div class="stat"><strong id="stat-qtd">0</strong><span>restaurantes</span></div>
          <div class="stat"><strong id="stat-nota">0</strong><span>nota média</span></div>
          <div class="stat"><strong id="stat-cidades">0</strong><span>cidades</span></div>
        </div>
        <a class="botao-hero" href="/novo-restaurante.html">+ Cadastrar restaurante</a>
      </div>
    </section>

    <section class="aviso" id="aviso" hidden></section>

    <div class="filtros-linha">
      <div class="chips" id="chips-categorias"></div>
      <div>
        <select class="select-escuro" id="ordenar">
          <option value="melhor">Melhor avaliados</option>
          <option value="nome">Nome</option>
        </select>
        <button type="button" class="botao-icone" id="botao-atualizar" title="Atualizar">↻</button>
      </div>
    </div>

    <h2 class="titulo-lista" id="titulo-lista">Todos os restaurantes</h2>
    <section class="grade-cards" id="lista-restaurantes">
      <p class="vazio">Carregando...</p>
    </section>
  </main>

  <footer class="rodape">
    <p>EasyFood — projeto acadêmico de Matheus Juvino</p>
  </footer>

  <script src="/js/sessao.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
