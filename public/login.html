<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyFood — Login</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="logo">EF</span>
      <div>
        <h1>EasyFood</h1>
        <p>Catálogo de restaurantes</p>
      </div>
    </div>
    <nav class="topo-nav" id="menu-principal"></nav>
  </header>

  <main class="conteudo conteudo-auth">
    <section class="aviso aviso-auth" id="aviso" hidden></section>

    <aside class="painel-auth-texto">
      <h2>Bem-vindo de volta</h2>
      <p>Entre para ver o catálogo e cadastrar novos restaurantes com a sua conta.</p>
      <div class="lista-destaques">
        <span>1. Crie sua conta</span>
        <span>2. Faça login</span>
        <span>3. Cadastre restaurantes</span>
      </div>
    </aside>

    <section class="painel painel-form">
      <h2>Login</h2>
      <p class="ajuda">Use o e-mail e a senha cadastrados.</p>
      <form id="form-login">
        <label>
          E-mail
          <input type="email" name="email" required placeholder="seuemail@exemplo.com">
        </label>
        <label>
          Senha
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="botao-principal">Entrar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>EasyFood — projeto acadêmico de Matheus Juvino</p>
  </footer>

  <script src="/js/sessao.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
